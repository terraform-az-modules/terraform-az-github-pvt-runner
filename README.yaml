name: Terraform Azure GitHub Hosted Compute Networking

license: "APACHE"

github_repo: terraform-az-modules/terraform-az-github-pvt-runner

badges:
  - name: "Terraform"
    image: "https://img.shields.io/badge/Terraform-v1.10.0-green"
    url: "https://www.terraform.io"
  - name: "Licence"
    image: "https://img.shields.io/badge/License-APACHE-blue.svg"
    url: "LICENSE.md"
  - name: "Changelog"
    image: "https://img.shields.io/badge/Changelog-blue"
    url: "CHANGELOG.md"

prerequisites:
  - name: Terraform
    url: https://learn.hashicorp.com/terraform/getting-started/install.html
    version: ">= 1.10.0"

providers:
  - name: azurerm
    url: https://registry.terraform.io/providers/hashicorp/azurerm/latest
    version: ">= 4.0"
  - name: azapi
    url: https://registry.terraform.io/providers/Azure/azapi/latest
    version: ">= 2.0"

description: |-
  Terraform module that provisions Azure infrastructure for GitHub Hosted Compute
  Networking. It creates the Resource Group, Virtual Network, Network Security
  Group, delegated subnet (`GitHub.Network/networkSettings`) and the GitHub
  Network Settings resource registered with GitHub. Optionally deploys a Linux
  Runner VM for validation or self-hosted scenarios.

usage: |-
  ### Example

  ```hcl
  module "github_pvt_runner" {
    source  = "terraform-az-modules/github-pvt-runner/azurerm"
    version = "1.0.0"

    location            = "eastus"
    resource_group_name = "rg-github-runner-dev"

    vnet_name          = "vnet-github-runner-dev"
    vnet_address_space = ["10.10.0.0/16"]

    runner_subnet_name     = "snet-github-runner"
    runner_subnet_prefixes = ["10.10.1.0/24"]

    nsg_name = "nsg-github-runner-dev"

    network_settings_name = "github-runner-network-settings"
    github_database_id    = "12345678"
  }
  ```
